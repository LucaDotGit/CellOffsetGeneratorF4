[Debug]

# The minimum level of information that is printed to the plugin's log file.
#
# The following log levels are available:
# "Trace"
# "Debug"
# "Information"
# "Warning"
# "Error"
# "Critical"
# "Off"
LogMinLevel = "Information"

# The maximum number of plugin log files to keep before they are rotated out.
LogRotationCount = 0

# The maximum byte size for a plugin log file before it is rotated out.
LogRotationByteSize = 0


[Generation]

# Whether a progress menu is shown during the generation.
EnableMenu = true

# Whether the generation will only be simulated, without actually creating any caching files.
DoDryRun = false

# The number of threads to use for the generation, minus the main thread.
ThreadCount = 0


[Benchmark]

# Whether a benchmark before and after the generation is run.
# The results are written to "Data/CellOffsetBenchmarks", after the game data has been initialized.
RunBenchmark = false

# The number of iterations to run for each benchmark case.
BenchmarkIterationCount = 100

# Specifies the benchmark cases to run.
