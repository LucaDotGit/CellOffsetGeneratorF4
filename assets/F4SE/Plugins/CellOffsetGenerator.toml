[Debug]

# [Default: 2] The minimum level of information that is printed to the plugin's log file.
#
# The following log levels are available:
# 00 = Trace
# 01 = Debug
# 02 = Information
# 03 = Warning
# 04 = Error
# 05 = Critical
# 06 = Off
iLogLevel = 2

# [Default: -1] The maximum number of log files to keep before overwriting older ones.
iLogFileCount = -1


[General]

# [Default: true] Whether a progress menu is being shown when generating cell offsets.
bEnableMenu = true

# [Default: false] Whether the cell offset generation will only be simulated, without actually creating any caching files.
bDoDryRun = false

# [Default: true] Whether created cell offset caching files are marked as read-only.
bCreateReadOnlyFiles = true


[Benchmark]

# [Default: false] Whether a benchmark before and after cell offset generation is run.
# The results are written to "Data/CellOffsetBenchmarks", after the game data is initialized.
bRunBenchmark = false

# [Default: 100] The number of iterations to run for each benchmark case.
uiBenchmarkIterationCount = 100

